<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="清晨的地铁列车，站台和铁轨">
<defs>
<radialGradient id="w1" cx="50%" cy="50%" r="65%"><stop offset="0%" stop-color="#CBE2D3"/><stop offset="100%" stop-color="#CBE2D3" stop-opacity="0"/></radialGradient>
<radialGradient id="w2" cx="50%" cy="50%" r="62%"><stop offset="0%" stop-color="#D3E2EE"/><stop offset="100%" stop-color="#D3E2EE" stop-opacity="0"/></radialGradient>
<filter id="s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="30"/></filter>
<filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.40 0 0 0 0 0.36 0 0 0 0 0.30 0 0 0 0.08 0"/></filter>
</defs>
<rect width="1200" height="900" fill="#FBF7EF"/>
<ellipse cx="300" cy="240" rx="330" ry="240" fill="url(#w1)" filter="url(#s)"/>
<ellipse cx="920" cy="660" rx="340" ry="250" fill="url(#w2)" filter="url(#s)"/>
<ellipse cx="620" cy="500" rx="200" ry="130" fill="#F4E7C9" opacity="0.35" filter="url(#s)"/>
<g fill="none" stroke="#6E655A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.82">
<!-- 列车车身 -->
<rect x="230" y="290" width="740" height="280" rx="48"/>
<!-- 车窗 -->
<rect x="290" y="340" width="110" height="90" rx="14"/>
<rect x="450" y="340" width="110" height="90" rx="14"/>
<rect x="610" y="340" width="110" height="90" rx="14"/>
<!-- 车门（带窗） -->
<rect x="790" y="330" width="110" height="210" rx="12"/>
<line x1="845" y1="345" x2="845" y2="525"/>
<rect x="812" y="360" width="26" height="70" rx="8"/>
<rect x="852" y="360" width="26" height="70" rx="8"/>
<!-- 车灯与转向架 -->
<circle cx="300" cy="590" r="22"/>
<circle cx="900" cy="590" r="22"/>
<rect x="330" y="575" width="120" height="40" rx="12"/>
<rect x="750" y="575" width="120" height="40" rx="12"/>
<!-- 铁轨 -->
<line x1="140" y1="680" x2="1060" y2="680"/>
<line x1="140" y1="706" x2="1060" y2="706"/>
<!-- 站台与立柱 -->
<line x1="140" y1="620" x2="230" y2="620"/>
<line x1="180" y1="620" x2="180" y2="220"/>
<rect x="150" y="170" width="150" height="52" rx="10"/>
<!-- 远处站台檐 -->
<line x1="120" y1="220" x2="1080" y2="220" opacity="0.35"/>
</g>
<g fill="none" stroke="#6E655A" stroke-width="5" stroke-linecap="round" opacity="0.4">
<line x1="290" y1="385" x2="400" y2="385"/>
<line x1="450" y1="385" x2="560" y2="385"/>
<line x1="610" y1="385" x2="720" y2="385"/>
<line x1="165" y1="196" x2="285" y2="196"/>
<line x1="160" y1="695" x2="300" y2="695"/>
<line x1="900" y1="695" x2="1040" y2="695"/>
<path d="M520 160 q10 -12 20 0 q10 -12 20 0"/>
<path d="M980 300 q8 -10 16 0 q8 -10 16 0"/>
</g>
<rect width="1200" height="900" filter="url(#g)" opacity="0.6"/>
</svg>
